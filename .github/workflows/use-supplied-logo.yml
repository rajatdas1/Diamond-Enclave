name: Use supplied Diamond Enclave logo

on:
  push:
    paths:
      - '.github/workflows/use-supplied-logo.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install supplied logo and update HTML
        shell: bash
        run: |
          cat > /tmp/logo.b64 <<'EOF'

          EOF
          base64 -d /tmp/logo.b64 > diamond-enclave-logo.jpg
          sed -i 's#src="logo.svg"#src="diamond-enclave-logo.jpg"#' index.html
          rm -f logo.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html diamond-enclave-logo.jpg logo.svg
          git commit -m "Use supplied Diamond Enclave logo" || exit 0
          git push
