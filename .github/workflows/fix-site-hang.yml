name: Fix site loading loop

on:
  push:
    paths:
      - '.github/workflows/fix-site-hang.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove recursive payment observer
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path=Path('index.html')
          html=path.read_text(encoding='utf-8')

          # The previous payment layer used a MutationObserver on #results and then
          # modified #results from inside the observer. That creates a continuous
          # mutation -> observer -> mutation loop and can make the page appear to
          # load forever, especially on mobile Safari.
          html=re.sub(r'<script id="payment-status-public-script">.*?</script>\s*', '', html, flags=re.S)
          html=re.sub(r'<script id="payment-status-correction-script">.*?</script>\s*', '', html, flags=re.S)

          safe_script=r'''<script id="payment-status-safe-script">
          (function(){
            var paymentStatus={
              "C-6D":{"maintenance":["Txn •••• 7788"]},
              "A-2D":{"maintenance":["Txn •••• 5998"],"sinking":["Paid · Ref not yet verified"]},
              "A-2A":{"maintenance":["Txn •••• 0566"],"sinking":["Txn •••• 7569"]},
              "B-6E":{"sinking":["Txn •••• 1553"]},
              "A-3E":{"maintenance":["Txn •••• 1568"],"sinking":["Txn •••• 0337"]},
              "D-1A":{"maintenance":["Txn •••• 1058"]},
              "A-4A":{"maintenance":["Txn •••• 2235"],"sinking":["Txn •••• 2235"]},
              "B-3A":{"maintenance":["Paid · Ref not yet verified"]},
              "B-4G":{"maintenance":["Txn •••• 3861"]},
              "C-5C":{"maintenance":["Txn •••• 3083","Txn •••• 0505"],"sinking":["Txn •••• 6920"]},
              "A-5E":{"maintenance":["Txn •••• 8201"]},
              "D-GB":{"maintenance":["Txn •••• 5854"],"sinking":["Txn •••• 8732"]},
              "B-5A":{"maintenance":["Txn •••• 3678"]},
              "B-5D":{"maintenance":["Txn •••• 4546","Txn •••• 8871"]},
              "B-5C":{"maintenance":["Txn •••• 1526"],"sinking":["Txn •••• 1526"]},
              "B-5E":{"maintenance":["Txn •••• 8656","Txn •••• 6475"]},
              "B-2C":{"maintenance":["Txn •••• 1247 · ₹400 due"],"sinking":["Txn •••• 1247"]},
              "B-5G":{"maintenance":["Paid · Ref not yet verified"]},
              "B-3G":{"maintenance":["Txn •••• 9699"]}
            };
            function esc(s){return String(s).replace(/[&<>\"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]})}
            function apply(){
              document.querySelectorAll('#results .resident').forEach(function(card){
                var f=card.querySelector('.flat'); if(!f)return;
                var p=paymentStatus[f.textContent.trim()];
                var m=card.querySelectorAll('.breakdown .metric');
                if(!p||m.length<4)return;
                function mark(i,refs){
                  var x=m[i];
                  x.classList.remove('payment-paid');
                  var old=x.querySelector('.payment-paid-status'); if(old)old.remove();
                  if(!refs||!refs.length)return;
                  x.classList.add('payment-paid');
                  x.insertAdjacentHTML('beforeend','<span class="payment-paid-status">✓ PAID'+refs.map(function(r){return '<span class="payment-txn">'+esc(r)+'</span>'}).join('')+'</span>');
                }
                mark(1,p.maintenance); mark(2,p.sinking);
              });
            }
            function scheduleApply(){setTimeout(apply,0);}
            document.addEventListener('DOMContentLoaded',function(){
              scheduleApply();
              var s=document.getElementById('search'); if(s)s.addEventListener('input',scheduleApply);
              document.querySelectorAll('select').forEach(function(el){el.addEventListener('change',scheduleApply);});
            });
          })();
          </script>'''

          html=html.replace('</body>',safe_script+'\n</body>',1)
          path.write_text(html,encoding='utf-8')
          PY
      - name: Commit fixed index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix infinite payment status loading loop"
            git push
          fi
