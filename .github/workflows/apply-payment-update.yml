name: Apply payment tracker update

on:
  push:
    paths:
      - payment_update.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update payment fields only
        env:
          PYTHONUTF8: '1'
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          updates = json.loads(Path('payment_update.json').read_text(encoding='utf-8'))

          m = re.search(r'const residents=(\[.*?\]);\s*const search=', html, re.S)
          if not m:
              raise SystemExit('Could not locate residents array')

          residents = json.loads(m.group(1))
          by_flat = {str(r.get('flat','')).strip(): r for r in residents}

          changed = []
          for u in updates:
              flat = str(u.get('flat','')).strip()
              if flat not in by_flat:
                  raise SystemExit(f'Flat not found in page: {flat}')
              r = by_flat[flat]
              before = {k:r.get(k) for k in ('maintenancePaid','maintenanceTxn','sinkingPaid','sinkingTxn','paymentDate')}
              for k in ('maintenancePaid','maintenanceTxn','sinkingPaid','sinkingTxn','paymentDate'):
                  if k in u:
                      if u[k] is None:
                          r.pop(k, None)
                      else:
                          r[k] = u[k]
              after = {k:r.get(k) for k in ('maintenancePaid','maintenanceTxn','sinkingPaid','sinkingTxn','paymentDate')}
              if before != after:
                  changed.append(flat)

          new_array = json.dumps(residents, ensure_ascii=False, separators=(',',':'))
          html = html[:m.start(1)] + new_array + html[m.end(1):]
          html_path.write_text(html, encoding='utf-8')
          print(f'Updated {len(changed)} resident records: {", ".join(changed)}')
          PY

      - name: Remove temporary update files
        run: rm -f payment_update.json .github/workflows/apply-payment-update.yml

      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git add -A
          git diff --cached --quiet || git commit -m "Update payment tracker from Excel"
          git push
